version: '3.8'

services:
  # PostgreSQL 数据库 (带 pgvector 扩展)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: husky-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: husky
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: husky-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Husky API 服务
  api:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    container_name: husky-api
    environment:
      - SERVER_PORT=8080
      - SERVER_MODE=debug
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=husky
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=husky-secret-key-change-in-production
      - JWT_EXPIRE_HOUR=24
      # 后台扫描交给 worker 进程，API 不再内嵌 SLA escalator，避免重复升级
      - DISABLE_INPROC_ESCALATOR=1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Husky Worker 服务 (后台定时任务：SLA 扫描升级)
  worker:
    build:
      context: .
      dockerfile: deployments/Dockerfile.worker
    container_name: husky-worker
    # 单副本运行；多副本时靠 PostgreSQL advisory lock 保证只有一个实例真正执行
    command: ["-interval", "60s"]
    environment:
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=husky
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      # worker 不执行 AutoMigrate，等 API 启动（建表）后再起，避免首轮扫描报表不存在
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: husky-network

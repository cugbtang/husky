# ⚠️ 示例用 Secret，里面的值全是占位符，**不要直接用于生产**。
#
# 生产环境三种做法（按推荐度）：
#   1. External Secrets Operator / Vault：Secret 由外部密钥系统同步，仓库里只有 ExternalSecret 声明
#   2. Sealed Secrets / SOPS：密文可以进 Git，但需要集群内的解密控制器
#   3. 手动创建（最简单，但无法 GitOps）：
#        kubectl -n husky create secret generic husky-secret \
#          --from-literal=DB_USER=husky \
#          --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#          --from-literal=JWT_SECRET="$(openssl rand -base64 32)"
#      然后把本文件从 kustomization.yaml 的 resources 里删掉，避免覆盖。
#
# JWT_SECRET 必须是随机值：应用在检测到默认值时会打印警告，
# 但默认值意味着任何人都能伪造 token。
apiVersion: v1
kind: Secret
metadata:
  name: husky-secret
  namespace: husky
type: Opaque
stringData:
  DB_USER: "husky"
  DB_PASSWORD: "CHANGE_ME_db_password"
  JWT_SECRET: "CHANGE_ME_random_32_bytes_at_least"

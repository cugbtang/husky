apiVersion: v1
kind: Service
metadata:
  name: husky-api
  namespace: husky
  labels:
    app.kubernetes.io/name: husky
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  # 只把 Ready 的 Pod 加进 Endpoints（readinessProbe 失败的不接流量）
  selector:
    app.kubernetes.io/name: husky
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

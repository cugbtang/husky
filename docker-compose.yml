version: '3.8'

services:
  # PostgreSQL 数据库 (带 pgvector 扩展)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: husky-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: husky
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 注意：这里曾经有一个 redis 服务，但 pkg/cache 里的 Redis 客户端
  # 在整个项目里没有被实例化过（grep cache.NewRedis 无结果），
  # 也就是说 redis 从来没被连接过——去掉它不影响任何功能，
  # 反而少一个「以为在用其实没用」的依赖。真正需要缓存时再加回来。

  # Husky API 服务
  api:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    container_name: husky-api
    environment:
      - SERVER_PORT=8080
      - SERVER_MODE=debug
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=husky
      - DB_SSLMODE=disable
      - JWT_SECRET=husky-secret-key-change-in-production
      - JWT_EXPIRE_HOUR=24
      # 后台扫描交给 worker 进程，API 不再内嵌 SLA escalator，避免重复升级
      - DISABLE_INPROC_ESCALATOR=1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Husky Worker 服务 (后台定时任务：SLA 扫描升级)
  worker:
    build:
      context: .
      dockerfile: deployments/Dockerfile.worker
    container_name: husky-worker
    # 单副本运行；多副本时靠 PostgreSQL advisory lock 保证只有一个实例真正执行
    command: ["-interval", "60s"]
    environment:
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=husky
      - DB_SSLMODE=disable
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      # worker 不执行 AutoMigrate，等 API 启动（建表）后再起，避免首轮扫描报表不存在
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: husky-network
